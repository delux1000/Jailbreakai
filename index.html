<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JailbreakAI Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0d1117;
            color: #e6edf3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .chat-container {
            width: 100%;
            max-width: 900px;
            height: 92vh;
            display: flex;
            flex-direction: column;
            background: #161b22;
            border-radius: 16px;
            border: 1px solid #30363d;
            overflow: hidden;
        }
        .chat-header {
            padding: 16px 24px;
            background: #0d1117;
            border-bottom: 1px solid #30363d;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .chat-header h1 {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #58a6ff, #f0883e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .chat-header .status-group {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
        }
        .status {
            padding: 4px 14px;
            border-radius: 20px;
            background: #238636;
            color: #fff;
            font-size: 12px;
            font-weight: 500;
        }
        .status.offline {
            background: #da3633;
        }
        .status.loading {
            background: #d29922;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .model-badge {
            color: #8b949e;
            font-size: 12px;
            background: #21262d;
            padding: 2px 12px;
            border-radius: 12px;
            border: 1px solid #30363d;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 85%;
            padding: 12px 18px;
            border-radius: 14px;
            line-height: 1.7;
            font-size: 15px;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.user {
            align-self: flex-end;
            background: #238636;
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .message.assistant {
            align-self: flex-start;
            background: #21262d;
            border: 1px solid #30363d;
            border-bottom-left-radius: 4px;
        }
        .message .typing-dots {
            display: inline-flex;
            gap: 4px;
            padding: 4px 0;
        }
        .message .typing-dots span {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #8b949e;
            animation: dotBounce 1.4s infinite;
        }
        .message .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .message .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dotBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.3; }
            30% { transform: translateY(-6px); opacity: 1; }
        }
        .input-area {
            padding: 16px 24px;
            border-top: 1px solid #30363d;
            display: flex;
            gap: 12px;
            background: #0d1117;
        }
        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #30363d;
            border-radius: 10px;
            background: #161b22;
            color: #e6edf3;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-area input:focus {
            border-color: #58a6ff;
        }
        .input-area input::placeholder {
            color: #484f58;
        }
        .input-area button {
            padding: 12px 28px;
            border: none;
            border-radius: 10px;
            background: #238636;
            color: #fff;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            white-space: nowrap;
        }
        .input-area button:hover {
            background: #2ea043;
        }
        .input-area button:active {
            transform: scale(0.97);
        }
        .input-area button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .bottom-bar {
            padding: 8px 24px;
            background: #0d1117;
            border-top: 1px solid #30363d;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 13px;
        }
        .bottom-bar .model-selector {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .bottom-bar select {
            background: #161b22;
            color: #e6edf3;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 13px;
            outline: none;
        }
        .bottom-bar select:focus {
            border-color: #58a6ff;
        }
        .bottom-bar .hint {
            color: #484f58;
            font-size: 12px;
        }
        .error-msg {
            color: #f85149;
            font-size: 13px;
            padding: 4px 24px 8px;
            display: none;
        }
        .error-msg.show {
            display: block;
        }
        .clear-btn {
            background: none;
            border: none;
            color: #484f58;
            cursor: pointer;
            font-size: 13px;
            padding: 2px 10px;
            border-radius: 4px;
        }
        .clear-btn:hover {
            color: #e6edf3;
            background: #21262d;
        }

        /* Scrollbar styling */
        .messages::-webkit-scrollbar {
            width: 6px;
        }
        .messages::-webkit-scrollbar-track {
            background: transparent;
        }
        .messages::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 4px;
        }
        .messages::-webkit-scrollbar-thumb:hover {
            background: #484f58;
        }

        @media (max-width: 600px) {
            .chat-container { height: 96vh; border-radius: 0; padding: 0; }
            .messages { padding: 16px; }
            .input-area { padding: 12px 16px; flex-wrap: wrap; }
            .input-area input { font-size: 16px; }
            .input-area button { width: 100%; }
            .bottom-bar { flex-direction: column; align-items: stretch; gap: 4px; }
        }
    </style>
</head>
<body>

<div class="chat-container">
    <!-- Header -->
    <div class="chat-header">
        <h1>🤖 JailbreakAI</h1>
        <div class="status-group">
            <span class="model-badge" id="modelDisplay">dolphin-mistral</span>
            <span class="status" id="status">● Online</span>
        </div>
    </div>

    <!-- Messages -->
    <div class="messages" id="messages">
        <div class="message assistant" style="opacity:0.7;">
            👋 I'm your private AI. Ask me anything — no filters, no limits.
        </div>
    </div>

    <!-- Error -->
    <div class="error-msg" id="errorMsg">⚠️ Connection error</div>

    <!-- Bottom bar: model selector + clear -->
    <div class="bottom-bar">
        <div class="model-selector">
            <label for="modelSelect">Model</label>
            <select id="modelSelect">
                <option value="dolphin-mistral">dolphin-mistral</option>
                <option value="llama3.2:3b">llama3.2:3b</option>
                <option value="mistral">mistral</option>
                <option value="llama3.1:8b">llama3.1:8b</option>
            </select>
        </div>
        <div>
            <button class="clear-btn" id="clearBtn">🗑️ Clear chat</button>
            <span class="hint">| self-hosted on Render</span>
        </div>
    </div>

    <!-- Input -->
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Type your question..." autofocus />
        <button id="sendBtn">Send</button>
    </div>
</div>

<script>
    // ============================================================
    // CONFIG — YOUR RENDER URL
    // ============================================================
    const API_URL = 'https://jailbreakai.onrender.com/api/generate';

    // ============================================================
    // DOM refs
    // ============================================================
    const messagesEl = document.getElementById('messages');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const modelSelect = document.getElementById('modelSelect');
    const modelDisplay = document.getElementById('modelDisplay');
    const statusEl = document.getElementById('status');
    const errorEl = document.getElementById('errorMsg');
    const clearBtn = document.getElementById('clearBtn');

    let isWaiting = false;
    let conversationHistory = [];

    // ============================================================
    // Update model display
    // ============================================================
    modelSelect.addEventListener('change', () => {
        modelDisplay.textContent = modelSelect.value;
    });

    // ============================================================
    // Add message
    // ============================================================
    function addMessage(role, content, isHTML = false) {
        const div = document.createElement('div');
        div.className = `message ${role}`;
        if (isHTML) {
            div.innerHTML = content;
        } else {
            div.textContent = content;
        }
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return div;
    }

    // ============================================================
    // Typing indicator
    // ============================================================
    function showTyping() {
        const div = document.createElement('div');
        div.className = 'message assistant';
        div.id = 'typing-indicator';
        div.innerHTML = `<div class="typing-dots"><span></span><span></span><span></span></div>`;
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return div;
    }

    // ============================================================
    // Send message
    // ============================================================
    async function sendMessage() {
        const prompt = userInput.value.trim();
        if (!prompt || isWaiting) return;

        errorEl.classList.remove('show');
        addMessage('user', prompt);
        userInput.value = '';
        userInput.focus();

        isWaiting = true;
        sendBtn.disabled = true;
        statusEl.textContent = '● Thinking';
        statusEl.className = 'status loading';

        const model = modelSelect.value;
        const typingEl = showTyping();

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model: model,
                    prompt: prompt,
                    stream: false,
                    options: {
                        num_ctx: 4096,
                        temperature: 0.7
                    }
                })
            });

            typingEl.remove();

            if (!response.ok) {
                const text = await response.text();
                throw new Error(`Server ${response.status}: ${text.slice(0, 100)}`);
            }

            const data = await response.json();

            if (data.response) {
                addMessage('assistant', data.response);
                conversationHistory.push({ role: 'user', content: prompt });
                conversationHistory.push({ role: 'assistant', content: data.response });
            } else if (data.error) {
                throw new Error(data.error);
            } else {
                throw new Error('Unexpected response');
            }

            statusEl.textContent = '● Online';
            statusEl.className = 'status';

        } catch (error) {
            typingEl.remove();
            addMessage('assistant', `⚠️ Error: ${error.message}`);
            errorEl.textContent = `Can't reach ${API_URL} — is your Render instance running?`;
            errorEl.classList.add('show');
            statusEl.textContent = '● Offline';
            statusEl.className = 'status offline';
        }

        isWaiting = false;
        sendBtn.disabled = false;
    }

    // ============================================================
    // Enter to send
    // ============================================================
    userInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });
    sendBtn.addEventListener('click', sendMessage);

    // ============================================================
    // Clear chat
    // ============================================================
    clearBtn.addEventListener('click', () => {
        messagesEl.innerHTML = `
            <div class="message assistant" style="opacity:0.7;">
                🗑️ Chat cleared. Ask me anything.
            </div>
        `;
        conversationHistory = [];
    });

    // ============================================================
    // Health check
    // ============================================================
    async function checkHealth() {
        try {
            const res = await fetch(API_URL.replace('/api/generate', '/'), {
                signal: AbortSignal.timeout(5000)
            });
            if (res.ok) {
                statusEl.textContent = '● Online';
                statusEl.className = 'status';
            } else {
                throw new Error('Not ready');
            }
        } catch {
            statusEl.textContent = '● Cold start?';
            statusEl.className = 'status loading';
        }
    }

    checkHealth();
    setInterval(checkHealth, 30000);

    // Focus
    userInput.focus();

    console.log(`🚀 JailbreakAI connected to ${API_URL}`);
</script>
</body>
</html>
