<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JailbreakAI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0d1117;
            color: #e6edf3;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            padding: 20px;
            min-height: 100vh;
        }
        .app {
            width: 100%;
            max-width: 900px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: #161b22;
            border-radius: 12px 12px 0 0;
            border: 1px solid #30363d;
            border-bottom: none;
        }
        .header h1 {
            font-size: 22px;
            background: linear-gradient(135deg, #58a6ff, #f0883e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .status {
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            background: #238636;
            color: #fff;
            font-weight: 500;
        }
        .status.offline {
            background: #da3633;
        }
        .status.loading {
            background: #d29922;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }
        .chat {
            height: 45vh;
            overflow-y: auto;
            padding: 20px 24px;
            background: #161b22;
            border: 1px solid #30363d;
            border-top: none;
            border-bottom: none;
        }
        .chat::-webkit-scrollbar {
            width: 6px;
        }
        .chat::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 4px;
        }
        .msg {
            padding: 10px 16px;
            border-radius: 12px;
            margin-bottom: 10px;
            max-width: 85%;
            word-wrap: break-word;
            line-height: 1.6;
        }
        .msg.user {
            background: #238636;
            color: #fff;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }
        .msg.ai {
            background: #21262d;
            border: 1px solid #30363d;
            border-bottom-left-radius: 4px;
        }
        .typing {
            color: #8b949e;
            padding: 8px 0;
            font-style: italic;
        }
        .input-area {
            display: flex;
            gap: 10px;
            padding: 16px 24px;
            background: #161b22;
            border: 1px solid #30363d;
            border-top: none;
            border-radius: 0 0 12px 12px;
            flex-wrap: wrap;
        }
        .input-area select {
            background: #0d1117;
            color: #e6edf3;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 14px;
            flex: 1;
            min-width: 130px;
        }
        .input-area select:focus {
            outline: none;
            border-color: #58a6ff;
        }
        .input-area input {
            flex: 2;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #30363d;
            background: #0d1117;
            color: #e6edf3;
            font-size: 14px;
            min-width: 150px;
        }
        .input-area input:focus {
            outline: none;
            border-color: #58a6ff;
        }
        .input-area input::placeholder {
            color: #484f58;
        }
        .input-area button {
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            background: #238636;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        .input-area button:hover {
            background: #2ea043;
        }
        .input-area button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .models-bar {
            padding: 10px 24px;
            background: #161b22;
            border: 1px solid #30363d;
            border-top: none;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            border-radius: 0 0 12px 12px;
            margin-top: 12px;
        }
        .model-tag {
            background: #21262d;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            border: 1px solid #30363d;
        }
        .error {
            color: #f85149;
            padding: 8px 24px;
            display: none;
        }
        .error.show {
            display: block;
        }
        .debug {
            color: #8b949e;
            font-size: 12px;
            padding: 8px 24px;
            border-top: 1px solid #30363d;
            font-family: monospace;
            margin-top: 12px;
            background: #161b22;
            border-radius: 12px;
            border: 1px solid #30363d;
            min-height: 30px;
        }
        .url-input {
            display: flex;
            gap: 10px;
            padding: 12px 24px;
            background: #161b22;
            border: 1px solid #30363d;
            border-top: none;
            border-radius: 0 0 12px 12px;
            flex-wrap: wrap;
            margin-top: 12px;
        }
        .url-input input {
            flex: 2;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #30363d;
            background: #0d1117;
            color: #e6edf3;
            font-size: 13px;
            min-width: 200px;
        }
        .url-input input:focus {
            outline: none;
            border-color: #58a6ff;
        }
        .url-input button {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            background: #1f6feb;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s;
        }
        .url-input button:hover {
            background: #388bfd;
        }
        .pull-area {
            display: flex;
            gap: 10px;
            padding: 12px 24px;
            background: #161b22;
            border: 1px solid #30363d;
            border-top: none;
            border-radius: 0 0 12px 12px;
            flex-wrap: wrap;
            margin-top: 12px;
        }
        .pull-area input {
            flex: 1;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #30363d;
            background: #0d1117;
            color: #e6edf3;
            font-size: 13px;
            min-width: 150px;
        }
        .pull-area input:focus {
            outline: none;
            border-color: #58a6ff;
        }
        .pull-area button {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            background: #1f6feb;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s;
        }
        .pull-area button:hover {
            background: #388bfd;
        }
        .pull-area button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .footer {
            text-align: center;
            padding: 16px;
            color: #484f58;
            font-size: 12px;
            margin-top: 16px;
        }
        @media (max-width: 600px) {
            .input-area select {
                min-width: 100%;
            }
            .input-area input {
                min-width: 100%;
            }
            .url-input input {
                min-width: 100%;
            }
            .pull-area input {
                min-width: 100%;
            }
            .chat {
                height: 40vh;
            }
        }
    </style>
</head>
<body>

<div class="app">
    <div class="header">
        <h1>🤖 JailbreakAI</h1>
        <span class="status" id="status">● Online</span>
    </div>

    <div class="chat" id="chat">
        <div class="msg ai">👋 Enter your Ollama server URL below, then select a model.</div>
    </div>

    <div class="url-input">
        <input type="text" id="apiUrlInput" placeholder="http://your-server-ip:11434" value="http://72.51.57.154:11434" />
        <button id="connectBtn">🔗 Connect</button>
    </div>

    <div class="error" id="error"></div>

    <div class="input-area">
        <select id="modelSelect"><option value="">Loading...</option></select>
        <input type="text" id="userInput" placeholder="Type your message..." />
        <button id="sendBtn">Send</button>
    </div>

    <div class="models-bar" id="modelsBar"><span style="color:#484f58;">Loading models...</span></div>

    <div class="pull-area">
        <input type="text" id="pullInput" placeholder="Model name (e.g., llama3.2:3b)" />
        <button id="pullBtn">📥 Pull Model</button>
    </div>

    <div class="debug" id="debug">Ready</div>

    <div class="footer">Your private AI • Self-hosted on VPS</div>
</div>

<script>
    // ============================================================
    // CONFIGURATION
    // ============================================================
    let API_URL = 'http://72.51.57.154:11434';
    let currentModel = '';
    let isWaiting = false;

    // ============================================================
    // DOM REFS
    // ============================================================
    const chat = document.getElementById('chat');
    const statusEl = document.getElementById('status');
    const errorEl = document.getElementById('error');
    const modelSelect = document.getElementById('modelSelect');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const modelsBar = document.getElementById('modelsBar');
    const debugEl = document.getElementById('debug');
    const apiUrlInput = document.getElementById('apiUrlInput');
    const connectBtn = document.getElementById('connectBtn');
    const pullInput = document.getElementById('pullInput');
    const pullBtn = document.getElementById('pullBtn');

    // ============================================================
    // DEBUG
    // ============================================================
    function debug(msg) {
        console.log('[DEBUG]', msg);
        debugEl.textContent = msg;
    }

    // ============================================================
    // ADD MESSAGE
    // ============================================================
    function addMessage(role, text) {
        const div = document.createElement('div');
        div.className = `msg ${role}`;
        div.textContent = text;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    // ============================================================
    // TYPING INDICATOR
    // ============================================================
    function showTyping() {
        const div = document.createElement('div');
        div.className = 'typing';
        div.id = 'typing';
        div.textContent = '⏳ Thinking...';
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    function hideTyping() {
        const el = document.getElementById('typing');
        if (el) el.remove();
    }

    // ============================================================
    // LOAD MODELS
    // ============================================================
    async function loadModels() {
        try {
            debug('Loading models...');
            statusEl.textContent = '● Loading';
            statusEl.className = 'status loading';

            const response = await fetch(`${API_URL}/api/tags`);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);

            const data = await response.json();
            const models = data.models || [];

            modelSelect.innerHTML = '';
            if (models.length === 0) {
                modelSelect.innerHTML = '<option value="">No models</option>';
                modelsBar.innerHTML = '<span style="color:#484f58;">No models. Pull one below.</span>';
                debug('No models found');
                return;
            }

            models.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m.name;
                opt.textContent = m.name;
                modelSelect.appendChild(opt);
            });

            currentModel = models[0].name;
            modelSelect.value = currentModel;

            modelsBar.innerHTML = models.map(m =>
                `<span class="model-tag">${m.name}</span>`
            ).join('');

            debug(`Loaded ${models.length} models`);
            statusEl.textContent = '● Online';
            statusEl.className = 'status';

        } catch (error) {
            debug(`Error: ${error.message}`);
            modelsBar.innerHTML = `<span style="color:#f85149;">❌ ${error.message}</span>`;
            statusEl.textContent = '● Offline';
            statusEl.className = 'status offline';
        }
    }

    // ============================================================
    // SEND MESSAGE
    // ============================================================
    async function sendMessage() {
        const prompt = userInput.value.trim();
        if (!prompt || isWaiting) {
            debug('Empty or waiting');
            return;
        }

        if (!currentModel) {
            errorEl.textContent = 'Please wait for models to load.';
            errorEl.className = 'error show';
            return;
        }

        errorEl.className = 'error';
        addMessage('user', prompt);
        userInput.value = '';
        userInput.focus();

        isWaiting = true;
        sendBtn.disabled = true;
        statusEl.textContent = '● Thinking';
        statusEl.className = 'status loading';
        showTyping();

        try {
            const response = await fetch(`${API_URL}/api/generate`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model: currentModel,
                    prompt: prompt,
                    stream: false
                })
            });

            hideTyping();

            if (!response.ok) {
                const text = await response.text();
                throw new Error(`Server ${response.status}: ${text}`);
            }

            const data = await response.json();

            if (data.response) {
                addMessage('ai', data.response);
                debug('Response received');
            } else if (data.error) {
                throw new Error(data.error);
            } else {
                throw new Error('No response');
            }

            statusEl.textContent = '● Online';
            statusEl.className = 'status';

        } catch (error) {
            hideTyping();
            debug(`ERROR: ${error.message}`);
            addMessage('ai', `⚠️ Error: ${error.message}`);
            errorEl.textContent = error.message;
            errorEl.className = 'error show';
            statusEl.textContent = '● Offline';
            statusEl.className = 'status offline';
        }

        isWaiting = false;
        sendBtn.disabled = false;
    }

    // ============================================================
    // PULL MODEL
    // ============================================================
    async function pullModel() {
        const model = pullInput.value.trim();
        if (!model) {
            alert('Enter a model name (e.g., llama3.2:3b)');
            return;
        }

        pullBtn.disabled = true;
        pullBtn.textContent = '⏳ Pulling...';
        debug(`Pulling ${model}...`);

        try {
            const response = await fetch(`${API_URL}/api/pull`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ model })
            });

            if (!response.ok) {
                const text = await response.text();
                throw new Error(`HTTP ${response.status}: ${text}`);
            }

            const data = await response.json();
            alert(`✅ ${data.message || 'Pull started'}`);
            pullInput.value = '';
            debug(`Pull started for ${model}`);

            // Reload models after 5 seconds
            setTimeout(loadModels, 5000);
            setTimeout(loadModels, 15000);

        } catch (error) {
            debug(`Pull error: ${error.message}`);
            alert(`❌ Error: ${error.message}`);
        } finally {
            pullBtn.disabled = false;
            pullBtn.textContent = '📥 Pull Model';
        }
    }

    // ============================================================
    // CONNECT
    // ============================================================
    function connect() {
        const url = apiUrlInput.value.trim();
        if (!url) {
            alert('Please enter a URL');
            return;
        }
        API_URL = url;
        debug(`Connecting to ${API_URL}...`);
        loadModels();
        addMessage('ai', `🔄 Connected to ${API_URL}`);
    }

    // ============================================================
    // EVENT LISTENERS
    // ============================================================
    modelSelect.addEventListener('change', () => {
        currentModel = modelSelect.value;
        debug(`Model: ${currentModel}`);
    });

    userInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            sendMessage();
        }
    });

    pullInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            pullModel();
        }
    });

    sendBtn.addEventListener('click', sendMessage);
    pullBtn.addEventListener('click', pullModel);
    connectBtn.addEventListener('click', connect);

    // ============================================================
    // INIT
    // ============================================================
    loadModels();
    setInterval(loadModels, 60000);
    userInput.focus();
    debug('Ready');
    console.log('🚀 JailbreakAI loaded');
</script>
</body>
</html>
